plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.reseaucarte'
version = '1.0.0'

android {
  namespace "expo.modules.reseaucarte"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// Spec 23 (D99) : MapLibre et OkHttp sont fournis à l'app par @maplibre/maplibre-react-native 11.5.1
// (android/gradle.properties du paquet : MapLibre Native 13.6.1, variante opengl, OkHttp 4.12.0).
// compileOnly : on compile contre les mêmes versions sans les embarquer une seconde fois.
// À aligner si @maplibre/maplibre-react-native change de version.
dependencies {
  compileOnly "org.maplibre.gl:android-sdk-opengl:13.6.1"
  compileOnly "com.squareup.okhttp3:okhttp:4.12.0"
}
