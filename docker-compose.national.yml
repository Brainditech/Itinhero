# MOTIS chargé avec toute la France, sur le PC seulement (spec 08). Jamais en CI.
# Données : donnees/ (ignoré par git), produites par `cd serveur && npm run donnees:nationales`.
# Projet Docker à part, pour ne pas toucher aux volumes des fixtures :
#   docker compose -p itinhero-national -f docker-compose.yml -f docker-compose.national.yml run --rm motis-import
#   docker compose -p itinhero-national -f docker-compose.yml -f docker-compose.national.yml up -d motis api
# Mêmes ports que le stack des fixtures : arrêter l'un avant de lancer l'autre.

services:
  motis-import:
    volumes:
      # Spec 44 (D125) : DONNEES choisit le dossier du jour après l'ingestion nocturne (défaut : ./donnees).
      - ${DONNEES:-./donnees}/config.yml:/config/config.yml:ro
      - ${DONNEES:-./donnees}:/donnees:ro

  motis:
    healthcheck:
      # Charger la France en mémoire prend plusieurs minutes.
      start_period: 900s

  api:
    environment:
      FIXTURES_MANIFEST: /donnees/manifest.json
      LIEUX_OSM: /donnees/poi/lieux.json # D61, produit par `npm run donnees:lieux`
      HORAIRES_GTFS: /donnees/horaires.json # D69, produit par `npm run donnees:horaires`
    volumes:
      - ${DONNEES:-./donnees}/manifest.json:/donnees/manifest.json:ro
      - ./donnees/poi/lieux.json:/donnees/poi/lieux.json:ro
      - ${DONNEES:-./donnees}/horaires.json:/donnees/horaires.json:ro

volumes:
  # Spec 44 (D125) : MOTIS_DONNEES nomme le volume importé du jour ; défaut : celui d'avant (rien ne change au PC).
  motis-data:
    name: ${MOTIS_DONNEES:-itinhero-national_motis-data}
