# CI Itinhero (spec 06, remplace la spec 01). Aucun secret, droits en lecture seule.
# Pas de blocage technique de la fusion (D33) : on ne fusionne jamais en rouge.
# Versions épinglées (invariant 17) : runner, Node, actions par SHA de commit complet.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: verifications
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            serveur/package-lock.json
      - name: Installation (app)
        run: npm ci
      - name: Lint (app)
        run: npx expo lint
      # expo-env.d.ts est écrit par `expo start` et ignoré par git ; sans lui, tsc ne connaît pas les imports .css.
      - name: Types Expo (expo-env.d.ts)
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - name: Types (app)
        run: npx tsc --noEmit
      - name: Tests (app)
        run: npm test
      - name: Build (bundle Android)
        run: npx expo export --platform android
      - name: Installation (serveur)
        working-directory: serveur
        run: npm ci
      - name: Types (serveur)
        working-directory: serveur
        run: npm run typecheck
      - name: Tests (serveur, dont sha256 du manifeste)
        working-directory: serveur
        run: npm test
      - name: Build (serveur)
        working-directory: serveur
        run: npm run build

  joigny:
    name: joigny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Spec 09 : le compose exige ces variables. Empreinte JETABLE : sha256 de la clé de test
      # « cle-de-test-ci-cle-de-test-ci-cle-de-test-c ». Pas un secret : l'API de la CI n'écoute que
      # sur 127.0.0.1 de la machine GitHub et ne vit que le temps du job.
      CLES_APPAREILS: 1b42b9c65da61c4855d7474b0f82b5cd7f0138165dc19721634f511965233409
      LIMITE_REQ_MINUTE: "30"
      LIMITE_REQ_JOUR: "500"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: serveur/package-lock.json
      - name: Versions de Docker
        run: docker version --format '{{.Server.Version}}' && docker compose version
      - name: Import MOTIS (fixtures figées)
        run: docker compose run --rm motis-import
      - name: Démarrage de MOTIS et de l'API
        run: docker compose up -d --build --wait --wait-timeout 300 --no-deps motis api
      - name: /health vert
        run: curl -fsS http://127.0.0.1:3000/health
      - name: /v1/lieux sans clé ⇒ 401 (spec 09)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/v1/lieux?q=Joigny')" = 401
      - name: Installation (serveur)
        working-directory: serveur
        run: npm ci
      - name: Test Joigny
        working-directory: serveur
        run: npm run test:joigny
        env:
          MOTIS_URL: http://127.0.0.1:8080
      - name: Journaux des conteneurs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Arrêt
        if: always()
        run: docker compose down -v
